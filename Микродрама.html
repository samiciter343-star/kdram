<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Микродрама</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--fg:#14131a;--muted:#77747f;--soft:#f3f2f6;--line:#e8e6ee;--accent:#14131a;--on-accent:#ffffff;--card:#ffffff;--on-media:#ffffff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e14;--fg:#f2f1f6;--muted:#9a97a6;--soft:#1a1922;--line:#2a2833;--accent:#f2f1f6;--on-accent:#14131a;--card:#1a1922;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e14;--fg:#f2f1f6;--muted:#9a97a6;--soft:#1a1922;--line:#2a2833;--accent:#f2f1f6;--on-accent:#14131a;--card:#1a1922;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.player-open,html.player-open body{overflow:hidden;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
h1,h2,h3,.disp{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500}
.wrap{max-width:520px;margin:0 auto;padding:16px 18px 48px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 22px}
.logo{font-family:"Unbounded",sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lead{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 20px;max-width:14em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 18px;margin:0 -18px;padding-left:18px;padding-right:18px}
.f{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px}
.f[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.feat{position:relative;width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;color:var(--on-media);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;margin-bottom:26px}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.6))}
.feat>*{position:relative;z-index:1}
.feat small{font-weight:700;font-size:13px;opacity:.9}
.feat h2{font-size:22px;margin:4px 0 12px;line-height:1.2}
.pill{align-self:flex-start;background:#fff;color:#14131a;font-weight:700;border-radius:999px;padding:9px 20px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px}
@media (min-width:720px){.wrap{max-width:820px}.grid{grid-template-columns:repeat(3,1fr)}}
.p{text-align:left;width:100%}
.poster{aspect-ratio:2/3;border-radius:16px;display:flex;align-items:flex-end;padding:12px;color:var(--on-media);font-family:"Unbounded",sans-serif;font-size:13px;line-height:1.25;margin-bottom:10px}
.p h3{font-family:"Manrope",sans-serif;font-weight:700;font-size:15px;margin:0;line-height:1.3}
.p .m{font-size:13px;color:var(--muted);margin-top:2px}
.note{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
#player{position:fixed;left:0;right:0;top:0;bottom:0;margin:auto;width:100vw;max-width:460px;height:100vh;height:100dvh;z-index:5;color:var(--on-media);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#player[hidden]{display:none}
#stage{position:absolute;inset:0}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.top,.bottom,.center{position:relative;z-index:2}
.bars{display:flex;gap:4px;padding:10px 14px 0}
.bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff}
.bar.done i{width:100%}
.head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.head .t{font-family:"Unbounded",sans-serif;font-size:13px}
.ibtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);font-size:18px;color:#fff}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 28px}
.big{font-family:"Unbounded",sans-serif;font-size:84px;line-height:1;margin:0;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.sub{margin-top:22px;font-size:19px;font-weight:700;line-height:1.35;background:rgba(0,0,0,.38);padding:10px 16px;border-radius:14px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sub{animation:none}}
.bottom{padding:0 12px 14px}
.ctrl{display:flex;justify-content:center;gap:14px;margin-bottom:12px}
.eps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;min-width:48px;height:44px;border-radius:12px;background:rgba(0,0,0,.4);color:#fff;font-weight:700;padding:0 12px}
.chip[aria-current="true"]{background:#fff;color:#14131a}
#stage::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 50%),radial-gradient(circle at 75% 70%,rgba(0,0,0,.18),transparent 55%);animation:drift 9s ease-in-out infinite alternate;z-index:1;pointer-events:none}
@keyframes drift{to{transform:translate(6%,4%) scale(1.1)}}
@media (prefers-reduced-motion:reduce){#stage::before{animation:none}.flash,.hint{transition:none}}
.zone{position:absolute;top:96px;bottom:150px;z-index:3;background:none}
.zl{left:0;width:30%}.zc{left:30%;width:40%}.zr{right:0;width:30%}
.rail{position:absolute;right:10px;bottom:176px;z-index:4;display:flex;flex-direction:column;gap:12px}
.lab{margin:0 0 10px;font-size:13px;font-weight:700;opacity:.85}
.flash{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;font-size:48px;opacity:0;transition:opacity .3s;pointer-events:none}
.hint{position:absolute;left:16px;right:70px;bottom:164px;z-index:4;text-align:center;font-size:12px;font-weight:600;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7)}
</style>
</head>
<body>
<main class="wrap" id="home">
  <div class="nav">
    <span class="logo">Микродрама</span>
    <div class="seg" role="group" aria-label="Язык / Тіл">
      <button id="lru" aria-pressed="true">РУ</button><button id="lkk" aria-pressed="false">ҚАЗ</button>
    </div>
  </div>
  <h1 class="lead" id="lead"></h1>
  <div class="chips" id="filters" role="group"></div>
  <button class="feat" id="feat"></button>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</main>

<section id="player" hidden aria-label="Player">
  <div id="stage"><video id="media" class="media" autoplay muted playsinline preload="auto" aria-label="Sample video"><source src="flower-sample.mp4" type="video/mp4"></video></div>
  <div class="top">
    <div class="bars" id="bars"></div>
    <div class="head">
      <button class="ibtn" id="close" aria-label="Close">✕</button>
      <span class="t" id="ptitle"></span>
      <button class="ibtn" id="pp" aria-label="Pause">❚❚</button>
    </div>
  </div>
  <div class="center"><p class="lab" id="lab"></p><p class="big" id="big"></p><p class="sub" id="sub"></p></div>
  <button class="zone zl" id="zl" aria-label="Prev"></button><button class="zone zc" id="zc" aria-label="Pause"></button><button class="zone zr" id="zr" aria-label="Next"></button>
  <div class="rail"><button class="ibtn" id="like" aria-label="Like">♡</button><button class="ibtn" id="share" aria-label="Share">↗</button></div>
  <div class="flash" id="flash"></div><div class="hint" id="hint"></div>
  <div class="bottom">
    <div class="ctrl"><button class="ibtn" id="prev" aria-label="Prev">‹</button><button class="ibtn" id="next" aria-label="Next">›</button></div>
    <div class="eps" id="eps"></div>
  </div>

</section>

<script>
var N=8;
var L={
ru:{lead:"Сериал за минуту. Смотрите с телефона.",all:"Все",fam:"Семья",rom:"Романтика",thr:"Триллер",newt:"Новинка",watch:"Смотреть",free:"Все серии бесплатно",eps:"{n} серий",
 note:"Все серии доступны бесплатно.",ep:"Серия",of:"Серия {n} из {m}",hint:"Справа: дальше · слева: назад · в центре: пауза · свайп вверх",
 H:["{A} впервые входит в дом, где её никто не ждёт.","На столе лежит конверт с именем {A}.","{B} улыбается, но руки у неё дрожат.","Правда о той ночи наконец всплывает.","{A} узнаёт, кто всё это время лгал.","Дверь открывается. На пороге стоит человек из прошлого.","{B} делает шаг, о котором будет жалеть.","Последний выбор. Что выберет {A}?"]},
kk:{lead:"Бір минуттық сериал. Телефоннан көріңіз.",all:"Барлығы",fam:"Отбасы",rom:"Романтика",thr:"Триллер",newt:"Жаңа",watch:"Көру",free:"Барлық сериялар тегін",eps:"{n} серия",
 note:"Барлық сериялар тегін қолжетімді.",ep:"Серия",of:"{m} ішінен {n}-серия",hint:"Оң жақ: келесі · сол жақ: алдыңғы · ортасы: пауза · жоғары сырғыту",
 H:["{A} ешкім күтпеген үйге алғаш рет кіреді.","Үстелде {A} есімі жазылған конверт жатыр.","{B} күліп тұр, бірақ қолдары дірілдейді.","Сол түннің шындығы ақыры ашылады.","{A} осы уақытқа дейін кім өтірік айтқанын біледі.","Есік ашылады. Табалдырықта өткеннен келген адам тұр.","{B} өкінетін қадам жасайды.","Соңғы таңдау. {A} нені таңдайды?"]}
};
var S=[
 {id:1,g:"fam",c:["#e8a0b8","#7a3b6e"],t:{ru:"Свекровь против невесты",kk:"Ене мен келін"},A:"Айгуль",B:{ru:"Свекровь",kk:"Ене"}},
 {id:2,g:"rom",c:["#9db8f0","#3b4f9c"],t:{ru:"Босс из будущего",kk:"Болашақтан келген бастық"},A:"Данияр",B:{ru:"Алия",kk:"Алия"}},
 {id:3,g:"thr",c:["#7fc4b8","#1f4b52"],t:{ru:"Долг чести",kk:"Намыс қарызы"},A:"Тимур",B:{ru:"Мадина",kk:"Мадина"}},
 {id:4,g:"rom",c:["#f2b88c","#a3475a"],t:{ru:"Свадьба без жениха",kk:"Күйеусіз той"},A:"Салтанат",B:{ru:"Ерлан",kk:"Ерлан"}},
 {id:5,g:"fam",c:["#c9b6e8","#52408f"],t:{ru:"Наследство в Алматы",kk:"Алматыдағы мұра"},A:"Асем",B:{ru:"Дядя Болат",kk:"Болат ағай"}},
 {id:6,g:"thr",c:["#8fa3b5","#1d2433"],t:{ru:"Ночной рейс",kk:"Түнгі рейс"},A:"Камила",B:{ru:"Руслан",kk:"Руслан"}}
];
var lang="ru",flt="all",cur=null,ep=0,paused=false;
function $(i){return document.getElementById(i)}
function T(k,o){var s=L[lang][k];if(o)for(var x in o)s=s.replace("{"+x+"}",o[x]);return s}
function grad(s){return "linear-gradient(160deg,"+s.c[0]+","+s.c[1]+")"}
function hook(s,i){return L[lang].H[i].replace(/\{A\}/g,s.A).replace(/\{B\}/g,s.B[lang])}

function home(){
  $("lead").textContent=T("lead");$("note").textContent=T("note");
  document.documentElement.lang=lang==="kk"?"kk":"ru";
  $("lru").setAttribute("aria-pressed",lang==="ru");$("lkk").setAttribute("aria-pressed",lang==="kk");
  var fb=$("filters");fb.innerHTML="";
  ["all","fam","rom","thr"].forEach(function(k){
    var b=document.createElement("button");b.className="f";b.textContent=T(k);b.setAttribute("aria-pressed",flt===k);
    b.onclick=function(){flt=k;home()};fb.appendChild(b)});
  var f=S[0],fe=$("feat");
  fe.style.background=grad(f);
  fe.innerHTML="<small>"+T("newt")+"</small><h2>"+f.t[lang]+"</h2><span class=\"pill\">"+T("watch")+"</span>";
  fe.onclick=function(){openS(f)};
  fe.hidden=flt!=="all";
  var g=$("grid");g.innerHTML="";
  S.filter(function(s){return flt==="all"||s.g===flt}).forEach(function(s){
    var b=document.createElement("button");b.className="p";
    b.innerHTML="<div class=\"poster\" style=\"background:"+grad(s)+"\">"+s.t[lang]+"</div><h3>"+s.t[lang]+"</h3><div class=\"m\">"+T(s.g)+" · "+T("eps",{n:N})+"</div><div class=\"m\">"+T("free")+"</div>";
    b.onclick=function(){openS(s)};g.appendChild(b)});
}
function openS(s){document.documentElement.classList.add("player-open");window.scrollTo(0,0);cur=s;ep=0;paused=false;$("pp").textContent="❚❚";$("home").hidden=true;$("player").hidden=false;$("stage").style.background=grad(s);chips();start();hint()}
function closeP(){$("media").pause();document.documentElement.classList.remove("player-open");$("player").hidden=true;$("home").hidden=false;window.scrollTo(0,0)}
function chips(){
  var c=$("eps");c.innerHTML="";
  for(var i=0;i<N;i++){(function(i){var b=document.createElement("button");b.className="chip";
    b.textContent=i+1;b.setAttribute("aria-label",T("ep")+" "+(i+1));b.onclick=function(){go(i)};c.appendChild(b)})(i)}
}
function render(){
  $("ptitle").textContent=cur.t[lang];$("big").textContent=ep+1;$("lab").textContent=T("of",{n:ep+1,m:N});updLike();
  var sub=$("sub");sub.textContent=hook(cur,ep);sub.style.animation="none";void sub.offsetWidth;sub.style.animation="";
  var bars=$("bars");bars.innerHTML="";
  for(var i=0;i<N;i++){var d=document.createElement("div");d.className="bar"+(i<ep?" done":"");d.innerHTML="<i></i>";bars.appendChild(d)}
  var cs=$("eps").children;for(var j=0;j<cs.length;j++)cs[j].setAttribute("aria-current",j===ep);
  if(cs[ep]){var strip=$("eps"),chip=cs[ep],cr=chip.getBoundingClientRect(),sr=strip.getBoundingClientRect();strip.scrollTo({left:strip.scrollLeft+cr.left-sr.left-(strip.clientWidth-cr.width)/2,behavior:"smooth"})}
}
function start(){
  render();var m=$("media");m.pause();
  try{m.currentTime=0}catch(e){}
  if(!paused){var p=m.play();if(p&&p.catch)p.catch(function(){})}
}
$("media").ontimeupdate=function(){var m=this,d=m.duration,f=$("bars").children[ep];if(d&&isFinite(d)&&f)f.firstChild.style.width=Math.min(100,m.currentTime/d*100)+"%"};
$("media").onended=function(){go(ep+1)};
function go(n){if(n<0)n=0;if(n>=N){closeP();return}ep=n;start()}
$("close").onclick=closeP;
$("prev").onclick=function(){go(ep-1)};$("next").onclick=function(){go(ep+1)};
$("pp").onclick=function(){paused=!paused;var m=$("media");if(paused)m.pause();else{var p=m.play();if(p&&p.catch)p.catch(function(){})}this.textContent=paused?"▶":"❚❚"};

$("lru").onclick=function(){lang="ru";home()};$("lkk").onclick=function(){lang="kk";home()};
var likes={},sx=0,sy=0;
function updLike(){var k=cur.id+"-"+ep;$("like").textContent=likes[k]?"♥":"♡";$("like").setAttribute("aria-pressed",!!likes[k])}
function flash(s){var f=$("flash");f.textContent=s;f.style.opacity=1;setTimeout(function(){f.style.opacity=0},700)}
function hint(){var h=$("hint");h.textContent=T("hint");h.style.opacity=1;setTimeout(function(){h.style.opacity=0},3500)}
$("like").onclick=function(){var k=cur.id+"-"+ep;likes[k]=!likes[k];updLike()};
$("share").onclick=function(){try{if(navigator.share){navigator.share({title:cur.t[lang],url:location.href}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href);flash("🔗")}}catch(e){}};
$("zl").onclick=function(){go(ep-1)};$("zr").onclick=function(){go(ep+1)};
$("zc").onclick=function(){$("pp").onclick();flash(paused?"❚❚":"▶")};
$("player").addEventListener("touchstart",function(e){sy=e.touches[0].clientY;sx=e.touches[0].clientX},{passive:true});
$("player").addEventListener("touchend",function(e){var dy=e.changedTouches[0].clientY-sy,dx=e.changedTouches[0].clientX-sx;if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.5)go(dy<0?ep+1:ep-1)},{passive:true});
document.addEventListener("keydown",function(e){if($("player").hidden)return;if(e.key==="ArrowRight"||e.key==="ArrowDown")go(ep+1);else if(e.key==="ArrowLeft"||e.key==="ArrowUp")go(ep-1);else if(e.key===" "){e.preventDefault();$("zc").onclick()}else if(e.key==="Escape")closeP()});
home();
</script>
</body>
</html>
